<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="t d"><title id="t">机器训练与人类培训边界</title><desc id="d">两类训练需要不同输入输出和指标</desc><rect width="900" height="330" rx="18" fill="#f6f7f9"/><text x="450" y="40" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1a1d24">中文都叫“训练”，证据链完全不同</text><g font-family="sans-serif"><rect x="40" y="72" width="380" height="215" rx="14" fill="#fff" stroke="#2563eb" stroke-width="3"/><text x="230" y="106" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">机器模型训练（论文已验证）</text><text x="70" y="145" font-size="16" fill="#1a1d24">输入：合成 RGB / LiDAR + 结构标签</text><text x="70" y="180" font-size="16" fill="#1a1d24">学习者：lane / detector / policy model</text><text x="70" y="215" font-size="16" fill="#1a1d24">指标：F1、LET-AP、mAP、minADE</text><text x="70" y="250" font-size="16" fill="#15803d">证据：Tables 1–4</text><rect x="480" y="72" width="380" height="215" rx="14" fill="#fff" stroke="#b45309" stroke-width="3" stroke-dasharray="8 5"/><text x="670" y="106" text-anchor="middle" font-size="20" font-weight="700" fill="#b45309">人类安全培训（论文未验证）</text><text x="510" y="145" font-size="16" fill="#1a1d24">输入：审核过的视频 + SOP / 题目</text><text x="510" y="180" font-size="16" fill="#1a1d24">学习者：驾驶员、叉车工、EHS 员工</text><text x="510" y="215" font-size="16" fill="#1a1d24">指标：理解、决策、保持率、现场迁移</text><text x="510" y="250" font-size="16" fill="#b45309">证据：需新实验</text></g></svg>
