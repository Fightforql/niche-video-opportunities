<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">SS-GEN 证据边界</title><desc id="d">论文验证数据和文本生成，视频与临床效果仍待验证</desc><rect width="900" height="300" rx="18" fill="#f6f7f9"/><text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1a1d24">SS-GEN 的证据到哪里为止？</text><g font-family="sans-serif"><rect x="28" y="78" width="190" height="125" rx="12" fill="#fff" stroke="#15803d" stroke-width="3"/><text x="123" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">已验证</text><text x="123" y="145" text-anchor="middle" font-size="16" fill="#1a1d24">受约束文本数据</text><text x="123" y="174" text-anchor="middle" font-size="16" fill="#1a1d24">LM 文本质量</text><path d="M218 140H278" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><rect x="278" y="78" width="190" height="125" rx="12" fill="#fff" stroke="#b45309" stroke-width="3"/><text x="373" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">产品迁移</text><text x="373" y="145" text-anchor="middle" font-size="16" fill="#1a1d24">分镜与视频生成</text><text x="373" y="174" text-anchor="middle" font-size="16" fill="#1a1d24">视觉事实 QA</text><path d="M468 140H528" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><rect x="528" y="78" width="160" height="125" rx="12" fill="#fff" stroke="#b45309" stroke-width="3" stroke-dasharray="7 5"/><text x="608" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">待研究</text><text x="608" y="145" text-anchor="middle" font-size="16" fill="#1a1d24">儿童理解</text><text x="608" y="174" text-anchor="middle" font-size="16" fill="#1a1d24">任务表现</text><path d="M688 140H748" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><rect x="748" y="78" width="125" height="125" rx="12" fill="#fff" stroke="#b45309" stroke-width="3" stroke-dasharray="7 5"/><text x="810" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">未证明</text><text x="810" y="145" text-anchor="middle" font-size="16" fill="#1a1d24">行为改善</text><text x="810" y="174" text-anchor="middle" font-size="16" fill="#1a1d24">临床疗效</text><text x="450" y="252" text-anchor="middle" font-size="15" fill="#5b6471">每跨一层都需要新的实验，不能从文本指标直接外推到干预效果</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker></defs></svg>
